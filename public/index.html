  <script>
    (() => {
      "use strict";


      /* ===================================================
         Elements
         =================================================== */

      const $ = (id) =>
        document.getElementById(id);


      const urlInput =
        $("urlInput");

      const analyzeButton =
        $("analyzeButton");

      const downloadButton =
        $("downloadButton");

      const clearButton =
        $("clearButton");

      const formatSelect =
        $("formatSelect");

      const qualitySelect =
        $("qualitySelect");

      const qualityField =
        $("qualityField");

      const filenameInput =
        $("filenameInput");

      const loading =
        $("loading");

      const message =
        $("message");

      const result =
        $("result");

      const thumbnail =
        $("thumbnail");

      const resultPlatform =
        $("resultPlatform");

      const resultTitle =
        $("resultTitle");

      const resultMeta =
        $("resultMeta");


      /* ===================================================
         State
         =================================================== */

      let currentInfo = null;

      let busy = false;

      const API_TIMEOUT =
        120000;


      /* ===================================================
         Message
         =================================================== */

      function showMessage(
        text,
        type = "info"
      ) {
        message.textContent =
          text;

        message.className =
          `message show ${type}`;
      }


      function hideMessage() {
        message.textContent = "";

        message.className =
          "message";
      }


      /* ===================================================
         Loading
         =================================================== */

      function setLoading(
        active,
        text = "正在分析..."
      ) {
        if (active) {
          loading
            .querySelector("span:last-child")
            .textContent = text;

          loading.classList.add(
            "show"
          );
        } else {
          loading.classList.remove(
            "show"
          );
        }
      }


      /* ===================================================
         Result
         =================================================== */

      function hideResult() {
        result.classList.remove(
          "show"
        );
      }


      function showResult(info) {
        currentInfo = info;

        resultPlatform.textContent =
          info.platform ||
          "未知平台";

        resultTitle.textContent =
          info.title ||
          "未命名影片";


        const meta = [];


        if (
          info.uploader
        ) {
          meta.push(
            info.uploader
          );
        }


        if (
          Number(info.duration) > 0
        ) {
          meta.push(
            formatDuration(
              info.duration
            )
          );
        }


        if (
          Number(info.view_count) > 0
        ) {
          meta.push(
            `${Number(info.view_count).toLocaleString()} 次觀看`
          );
        }


        resultMeta.textContent =
          meta.join(" · ") ||
          "公開影音";


        if (info.thumbnail) {
          thumbnail.src =
            info.thumbnail;

          thumbnail.style.display =
            "block";
        } else {
          thumbnail.removeAttribute(
            "src"
          );

          thumbnail.style.display =
            "none";
        }


        if (
          !filenameInput.value.trim()
        ) {
          filenameInput.value =
            safeName(
              info.title ||
              "LinkGrab"
            );
        }


        result.classList.add(
          "show"
        );
      }


      /* ===================================================
         Duration
         =================================================== */

      function formatDuration(
        seconds
      ) {
        const total =
          Math.max(
            0,
            Math.floor(
              Number(seconds) || 0
            )
          );


        const h =
          Math.floor(
            total / 3600
          );

        const m =
          Math.floor(
            (total % 3600) / 60
          );

        const s =
          total % 60;


        if (h > 0) {
          return [
            h,
            String(m).padStart(
              2,
              "0"
            ),
            String(s).padStart(
              2,
              "0"
            )
          ].join(":");
        }


        return [
          m,
          String(s).padStart(
            2,
            "0"
          )
        ].join(":");
      }


      /* ===================================================
         Safe Name
         =================================================== */

      function safeName(
        name
      ) {
        return String(
          name || "LinkGrab"
        )
          .replace(
            /[\\/:*?"<>|\x00-\x1F]/g,
            "_"
          )
          .replace(
            /\s+/g,
            " "
          )
          .trim()
          .slice(
            0,
            100
          ) || "LinkGrab";
      }


      /* ===================================================
         Platform Detection
         =================================================== */

      function isYouTube(
        url
      ) {
        const u =
          String(url)
            .toLowerCase();


        return (
          u.includes(
            "youtube.com"
          ) ||
          u.includes(
            "youtu.be"
          )
        );
      }


      /*
       * Threads
       *
       * 只接受 threads.com
       *
       * 不加入 threads.net。
       */

      function isThreads(
        url
      ) {
        return String(url)
          .toLowerCase()
          .includes(
            "threads.com"
          );
      }


      function isSupportedPlatform(
        url
      ) {
        const u =
          String(url)
            .toLowerCase();


        return (
          u.includes(
            "instagram.com"
          ) ||

          u.includes(
            "facebook.com"
          ) ||

          u.includes(
            "fb.watch"
          ) ||

          u.includes(
            "twitter.com"
          ) ||

          u.includes(
            "x.com"
          ) ||

          u.includes(
            "vimeo.com"
          ) ||

          u.includes(
            "soundcloud.com"
          ) ||

          /*
           * Threads
           */
          isThreads(u)
        );
      }


      /* ===================================================
         Fetch Helpers
         =================================================== */

      async function fetchWithTimeout(
        url,
        options = {},
        timeout = API_TIMEOUT
      ) {
        const controller =
          new AbortController();

        const timer =
          setTimeout(
            () =>
              controller.abort(),
            timeout
          );


        try {
          return await fetch(
            url,
            {
              ...options,
              signal:
                controller.signal
            }
          );
        } finally {
          clearTimeout(timer);
        }
      }


      async function readJson(
        response
      ) {
        const text =
          await response.text();


        let data = null;


        try {
          data =
            JSON.parse(text);
        } catch {
          data = null;
        }


        if (!response.ok) {
          throw new Error(
            data?.error ||
            text ||
            `HTTP ${response.status}`
          );
        }


        return data || {};
      }


      /* ===================================================
         Analyze
         =================================================== */

      async function analyze() {
        if (busy) {
          return;
        }


        const url =
          urlInput.value.trim();


        hideMessage();
        hideResult();


        if (!url) {
          showMessage(
            "請先貼上影音網址。",
            "error"
          );

          return;
        }


        if (
          !/^https?:\/\//i.test(
            url
          )
        ) {
          showMessage(
            "請輸入有效的網址。",
            "error"
          );

          return;
        }


        if (isYouTube(url)) {
          showMessage(
            "YouTube 目前暫不可用，請改用其他支援平台。",
            "error"
          );

          return;
        }


        if (
          !isSupportedPlatform(
            url
          )
        ) {
          showMessage(
            "目前不支援這個網站。",
            "error"
          );

          return;
        }


        busy = true;

        analyzeButton.disabled =
          true;

        downloadButton.disabled =
          true;

        setLoading(
          true,
          "正在分析..."
        );


        try {
          const response =
            await fetchWithTimeout(
              "/api/info",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    url
                  })
              }
            );


          const info =
            await readJson(
              response
            );


          showResult(info);


          showMessage(
            `${info.platform || "影音"} 分析完成，可以下載。`,
            "success"
          );

        } catch (error) {
          if (
            error?.name ===
            "AbortError"
          ) {
            showMessage(
              "分析逾時，請稍後再試。",
              "error"
            );
          } else {
            showMessage(
              error?.message ||
                "分析失敗，請稍後再試。",
              "error"
            );
          }

        } finally {
          busy = false;

          analyzeButton.disabled =
            false;

          downloadButton.disabled =
            false;

          setLoading(false);
        }
      }


      /* ===================================================
         Download
         =================================================== */

      async function download() {
        if (
          busy ||
          !currentInfo
        ) {
          return;
        }


        const url =
          urlInput.value.trim();


        if (!url) {
          return;
        }


        const format =
          formatSelect.value ===
          "mp3"
            ? "mp3"
            : "mp4";


        const quality =
          qualitySelect.value;


        const filename =
          safeName(
            filenameInput.value ||
              currentInfo.title ||
              "LinkGrab"
          );


        busy = true;

        analyzeButton.disabled =
          true;

        downloadButton.disabled =
          true;


        setLoading(
          true,
          "正在準備下載..."
        );

        hideMessage();


        try {
          const response =
            await fetchWithTimeout(
              "/api/download",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    url,
                    format,
                    quality,
                    filename
                  })
              },

              15 * 60 * 1000
            );


          if (!response.ok) {
            const text =
              await response.text();


            let data = null;


            try {
              data =
                JSON.parse(text);
            } catch {
              data = null;
            }


            throw new Error(
              data?.error ||
              text ||
              `HTTP ${response.status}`
            );
          }


          const blob =
            await response.blob();


          if (
            !blob ||
            blob.size === 0
          ) {
            throw new Error(
              "伺服器沒有回傳有效檔案。"
            );
          }


          const objectUrl =
            URL.createObjectURL(
              blob
            );


          const a =
            document.createElement(
              "a"
            );


          a.href =
            objectUrl;

          a.download =
            `${filename}.${format}`;

          document.body.appendChild(
            a
          );

          a.click();

          a.remove();


          setTimeout(
            () =>
              URL.revokeObjectURL(
                objectUrl
              ),
            5000
          );


          showMessage(
            "下載已開始。",
            "success"
          );

        } catch (error) {
          if (
            error?.name ===
            "AbortError"
          ) {
            showMessage(
              "下載逾時，請稍後再試。",
              "error"
            );
          } else {
            showMessage(
              error?.message ||
                "下載失敗，請稍後再試。",
              "error"
            );
          }

        } finally {
          busy = false;

          analyzeButton.disabled =
            false;

          downloadButton.disabled =
            false;

          setLoading(false);
        }
      }


      /* ===================================================
         Clear
         =================================================== */

      function clearAll() {
        if (busy) {
          return;
        }


        urlInput.value =
          "";

        filenameInput.value =
          "";

        currentInfo =
          null;


        hideMessage();

        hideResult();
      }


      /* ===================================================
         Format Change
         =================================================== */

      formatSelect.addEventListener(
        "change",
        () => {
          if (
            formatSelect.value ===
            "mp3"
          ) {
            qualityField.style.display =
              "none";
          } else {
            qualityField.style.display =
              "";
          }
        }
      );


      /* ===================================================
         Events
         =================================================== */

      analyzeButton.addEventListener(
        "click",
        analyze
      );


      downloadButton.addEventListener(
        "click",
        download
      );


      clearButton.addEventListener(
        "click",
        clearAll
      );


      urlInput.addEventListener(
        "keydown",
        (event) => {
          if (
            event.key ===
            "Enter"
          ) {
            event.preventDefault();

            analyze();
          }
        }
      );


      /* ===================================================
         Page Show
         =================================================== */

      window.addEventListener(
        "pageshow",
        () => {
          busy = false;

          analyzeButton.disabled =
            false;

          downloadButton.disabled =
            false;

          setLoading(false);
        }
      );


      /* ===================================================
         Initial State
         =================================================== */

      formatSelect.dispatchEvent(
        new Event("change")
      );

    })();
  </script>

</html>
