<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />

  <title>LinkGrab 1.0.2</title>

  <meta
    name="description"
    content="LinkGrab — 簡單快速的網頁影音下載工具"
  />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       Header
    ========================= */

    .header {
      height: 72px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-version {
      font-size: 12px;
      color: #6b7280;
      margin-top: 3px;
    }

    .status-top {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #4b5563;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
    }

    /* =========================
       Main
    ========================= */

    .main {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      flex: 1;
      padding: 42px 0 48px;
    }

    .hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.12;
      letter-spacing: -1.5px;
      font-weight: 850;
    }

    .hero p {
      margin: 12px auto 0;
      color: #6b7280;
      font-size: 16px;
      line-height: 1.7;
      max-width: 620px;
    }

    /* =========================
       Platform bar
    ========================= */

    .platform-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.05);
    }

    .platform-title {
      font-size: 13px;
      font-weight: 800;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .platform {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 999px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      font-size: 13px;
      color: #374151;
      white-space: nowrap;
    }

    .platform .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #16a34a;
      flex-shrink: 0;
    }

    .platform.testing .dot {
      background: #f59e0b;
    }

    .platform.disabled .dot {
      background: #ef4444;
    }

    .platform.disabled {
      color: #9ca3af;
      background: #f9fafb;
    }

    /* =========================
       Download card
    ========================= */

    .download-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 14px 40px rgba(15, 23, 42, 0.07);
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .section-description {
      margin: 7px 0 22px;
      color: #6b7280;
      font-size: 14px;
    }

    .url-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    .url-input {
      width: 100%;
      min-width: 0;
      height: 52px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      outline: none;
      padding: 0 16px;
      background: #fff;
      color: #111827;
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .url-input::placeholder {
      color: #9ca3af;
    }

    .url-input:focus {
      border-color: #111827;
      box-shadow: 0 0 0 4px rgba(17, 24, 39, 0.07);
    }

    .primary-btn {
      height: 52px;
      border: 0;
      border-radius: 14px;
      padding: 0 22px;
      background: #111827;
      color: white;
      font-weight: 800;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        background 0.15s ease;
      white-space: nowrap;
    }

    .primary-btn:hover {
      background: #1f2937;
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    .primary-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    /* =========================
       Options
    ========================= */

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .option {
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      padding: 14px;
      background: #fafafa;
    }

    .option label {
      display: block;
      font-size: 12px;
      color: #6b7280;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .option select,
    .option input {
      width: 100%;
      height: 42px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      padding: 0 11px;
      outline: none;
    }

    /* =========================
       Result
    ========================= */

    .result {
      display: none;
      margin-top: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      background: white;
    }

    .result.show {
      display: block;
    }

    .result-inner {
      padding: 20px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 13px;
      background: #f3f4f6;
    }

    .result-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .result-platform {
      display: inline-flex;
      width: fit-content;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .result-title {
      font-size: 20px;
      line-height: 1.45;
      font-weight: 800;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .result-meta {
      color: #6b7280;
      font-size: 13px;
      margin-top: 9px;
    }

    .download-actions {
      margin-top: auto;
      padding-top: 18px;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .secondary-btn {
      min-height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: white;
      color: #111827;
      padding: 0 15px;
      font-weight: 750;
    }

    .secondary-btn:hover {
      background: #f9fafb;
    }

    /* =========================
       Loading
    ========================= */

    .loading {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      color: #6b7280;
      font-size: 13px;
    }

    .loading.show {
      display: flex;
    }

    .spinner {
      width: 17px;
      height: 17px;
      border: 2px solid #e5e7eb;
      border-top-color: #111827;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       Message
    ========================= */

    .message {
      display: none;
      margin-top: 15px;
      border-radius: 13px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.6;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .message.warning {
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
    }

    .message.success {
      color: #166534;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    /* =========================
       Footer
    ========================= */

    .footer {
      text-align: center;
      padding: 24px;
      color: #9ca3af;
      font-size: 12px;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 700px) {
      .header {
        height: 64px;
        padding: 0 16px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }

      .brand-title {
        font-size: 16px;
      }

      .brand-version {
        font-size: 11px;
      }

      .status-top {
        font-size: 11px;
      }

      .main {
        width: min(100% - 24px, 1120px);
        padding: 26px 0 32px;
      }

      .hero {
        margin-bottom: 23px;
      }

      .hero h1 {
        font-size: 31px;
        letter-spacing: -1px;
      }

      .hero p {
        font-size: 14px;
        margin-top: 9px;
      }

      .platform-card {
        border-radius: 17px;
        padding: 14px;
      }

      .platforms {
        gap: 7px;
      }

      .platform {
        padding: 7px 9px;
        font-size: 12px;
      }

      .download-card {
        border-radius: 18px;
        padding: 18px;
      }

      .section-title {
        font-size: 18px;
      }

      .section-description {
        font-size: 13px;
        margin-bottom: 17px;
      }

      .url-row {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .url-input {
        height: 50px;
        font-size: 16px;
      }

      .primary-btn {
        width: 100%;
        height: 50px;
      }

      .options {
        grid-template-columns: 1fr;
        gap: 9px;
        margin-top: 12px;
      }

      .option {
        padding: 12px;
      }

      .result-inner {
        grid-template-columns: 1fr;
        padding: 15px;
        gap: 14px;
      }

      .thumbnail {
        max-height: 210px;
      }

      .result-title {
        font-size: 17px;
      }

      .download-actions {
        margin-top: 5px;
      }

      .secondary-btn {
        flex: 1;
      }

      .footer {
        padding: 20px 14px;
      }
    }

    @media (max-width: 380px) {
      .status-top span {
        display: none;
      }

      .hero h1 {
        font-size: 28px;
      }

      .platform {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <div class="brand-icon">L</div>

        <div class="brand-text">
          <div class="brand-title">LinkGrab</div>
          <div class="brand-version">Web 1.0.2</div>
        </div>
      </div>

      <div class="status-top">
        <span class="status-dot"></span>
        <span>服務正常</span>
      </div>
    </header>

    <main class="main">

      <section class="hero">
        <h1>簡單、快速地取得影音</h1>
        <p>
          貼上影音網址，分析內容後選擇 MP4 或 MP3。
        </p>
      </section>

      <section class="platform-card">
        <div class="platform-title">支援平台</div>

        <div class="platforms">

          <div class="platform">
            <span class="dot"></span>
            Instagram
          </div>

          <div class="platform">
            <span class="dot"></span>
            Facebook
          </div>

          <div class="platform">
            <span class="dot"></span>
            TikTok
          </div>

          <div class="platform">
            <span class="dot"></span>
            X / Twitter
          </div>

          <div class="platform">
            <span class="dot"></span>
            Vimeo
          </div>

          <div class="platform">
            <span class="dot"></span>
            SoundCloud
          </div>

          <div class="platform testing">
            <span class="dot"></span>
            Threads
          </div>

          <div class="platform disabled">
            <span class="dot"></span>
            YouTube 暫不可用
          </div>

        </div>
      </section>

      <section class="download-card">

        <h2 class="section-title">貼上網址</h2>

        <p class="section-description">
          支援公開影音網址。YouTube 目前暫停使用。
        </p>

        <div class="url-row">
          <input
            id="urlInput"
            class="url-input"
            type="url"
            inputmode="url"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="https://..."
          />

          <button id="analyzeBtn" class="primary-btn">
            分析網址
          </button>
        </div>

        <div id="loading" class="loading">
          <span class="spinner"></span>
          <span id="loadingText">正在分析網址…</span>
        </div>

        <div id="message" class="message"></div>

        <div class="options">

          <div class="option">
            <label for="formatSelect">下載格式</label>

            <select id="formatSelect">
              <option value="mp4">MP4 — 影片＋音訊</option>
              <option value="mp3">MP3 — 僅音訊</option>
            </select>
          </div>

          <div class="option" id="qualityOption">
            <label for="qualitySelect">影片品質</label>

            <select id="qualitySelect">
              <option value="high">高畫質 — 最多 1080p</option>
              <option value="medium">中畫質 — 最多 720p</option>
              <option value="low">低畫質 — 最多 480p</option>
            </select>
          </div>

          <div class="option">
            <label for="filenameInput">檔案名稱</label>

            <input
              id="filenameInput"
              type="text"
              maxlength="100"
              placeholder="LinkGrab"
            />
          </div>

        </div>

        <div id="result" class="result">

          <div class="result-inner">

            <img
              id="thumbnail"
              class="thumbnail"
              alt="影片縮圖"
            />

            <div class="result-info">

              <div id="resultPlatform" class="result-platform">
                Platform
              </div>

              <h3 id="resultTitle" class="result-title">
                未命名影片
              </h3>

              <div id="resultMeta" class="result-meta"></div>

              <div class="download-actions">

                <button
                  id="downloadBtn"
                  class="primary-btn"
                  type="button"
                >
                  下載
                </button>

                <button
                  id="clearBtn"
                  class="secondary-btn"
                  type="button"
                >
                  清除
                </button>

              </div>

            </div>

          </div>

        </div>

      </section>

    </main>

    <footer class="footer">
      LinkGrab 1.0.2 · Web Version
    </footer>

  </div>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);

      const urlInput = $("urlInput");
      const analyzeBtn = $("analyzeBtn");
      const downloadBtn = $("downloadBtn");
      const clearBtn = $("clearBtn");

      const formatSelect = $("formatSelect");
      const qualitySelect = $("qualitySelect");
      const qualityOption = $("qualityOption");
      const filenameInput = $("filenameInput");

      const loading = $("loading");
      const loadingText = $("loadingText");
      const message = $("message");

      const result = $("result");
      const thumbnail = $("thumbnail");
      const resultPlatform = $("resultPlatform");
      const resultTitle = $("resultTitle");
      const resultMeta = $("resultMeta");

      let currentInfo = null;
      let busy = false;

      const API_TIMEOUT = 120000;

      function showMessage(text, type = "error") {
        message.textContent = text;
        message.className = `message show ${type}`;
      }

      function hideMessage() {
        message.textContent = "";
        message.className = "message";
      }

      function setLoading(active, text = "處理中…") {
        loadingText.textContent = text;
        loading.classList.toggle("show", active);

        analyzeBtn.disabled = active;
        downloadBtn.disabled = active;

        busy = active;
      }

      function hideResult() {
        result.classList.remove("show");
        currentInfo = null;
      }

      function showResult(data) {
        currentInfo = data;

        result.classList.add("show");

        resultPlatform.textContent =
          data.platform || "未知平台";

        resultTitle.textContent =
          data.title || "未命名影片";

        const meta = [];

        if (data.uploader) {
          meta.push(data.uploader);
        }

        if (data.duration) {
          meta.push(formatDuration(data.duration));
        }

        if (data.view_count) {
          meta.push(`${Number(data.view_count).toLocaleString()} 次觀看`);
        }

        resultMeta.textContent =
          meta.length ? meta.join(" · ") : "已取得影片資訊";

        if (data.thumbnail) {
          thumbnail.src = data.thumbnail;
          thumbnail.style.display = "block";
        } else {
          thumbnail.removeAttribute("src");
          thumbnail.style.display = "none";
        }

        if (!filenameInput.value.trim()) {
          filenameInput.value = safeName(data.title || "LinkGrab");
        }
      }

      function formatDuration(seconds) {
        seconds = Number(seconds) || 0;

        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);

        if (h > 0) {
          return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        }

        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function safeName(name) {
        return String(name || "LinkGrab")
          .replace(/[\\/:*?"<>|]/g, "_")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 100) || "LinkGrab";
      }

      function isYouTube(url) {
        const value = String(url).toLowerCase();

        return (
          value.includes("youtube.com") ||
          value.includes("youtu.be")
        );
      }

      function isSupportedPlatform(url) {
        const value = String(url).toLowerCase();

        return (
          value.includes("instagram.com") ||
          value.includes("facebook.com") ||
          value.includes("fb.watch") ||
          value.includes("tiktok.com") ||
          value.includes("twitter.com") ||
          value.includes("x.com") ||
          value.includes("vimeo.com") ||
          value.includes("soundcloud.com") ||
          value.includes("threads.net") ||
          value.includes("threads.com")
        );
      }

      async function fetchWithTimeout(url, options = {}) {
        const controller = new AbortController();

        const timer = setTimeout(() => {
          controller.abort();
        }, API_TIMEOUT);

        try {
          return await fetch(url, {
            ...options,
            signal: controller.signal
          });
        } finally {
          clearTimeout(timer);
        }
      }

      async function readJson(response) {
        let data = null;

        try {
          data = await response.json();
        } catch {
          throw new Error(`伺服器回應異常（HTTP ${response.status}）`);
        }

        if (!response.ok) {
          throw new Error(
            data?.error ||
            `伺服器錯誤（HTTP ${response.status}）`
          );
        }

        return data;
      }

      async function analyze() {
        if (busy) return;

        const url = urlInput.value.trim();

        hideMessage();
        hideResult();

        if (!url) {
          showMessage("請先貼上網址。");
          urlInput.focus();
          return;
        }

        if (!/^https?:\/\//i.test(url)) {
          showMessage("請輸入完整的 http:// 或 https:// 網址。");
          urlInput.focus();
          return;
        }

        if (isYouTube(url)) {
          showMessage(
            "YouTube 目前暫不可用。其他支援平台可以正常使用。",
            "warning"
          );
          return;
        }

        if (!isSupportedPlatform(url)) {
          showMessage(
            "目前這個網址不在 LinkGrab 的支援平台清單中。",
            "warning"
          );
          return;
        }

        setLoading(true, "正在分析網址…");

        try {
          const response = await fetchWithTimeout("/api/info", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ url })
          });

          const data = await readJson(response);

          showResult(data);

          showMessage(
            "影片資訊取得成功，可以開始下載。",
            "success"
          );
        } catch (error) {
          if (error.name === "AbortError") {
            showMessage(
              "分析等待時間過長，請稍後再試。"
            );
          } else {
            showMessage(
              error.message || "分析失敗，請稍後再試。"
            );
          }
        } finally {
          setLoading(false);
        }
      }

      async function download() {
        if (busy) return;

        if (!currentInfo) {
          showMessage("請先分析網址。");
          return;
        }

        const url = urlInput.value.trim();

        if (!url) {
          showMessage("網址不存在，請重新分析。");
          return;
        }

        if (isYouTube(url)) {
          showMessage(
            "YouTube 目前暫不可用。",
            "warning"
          );
          return;
        }

        const format = formatSelect.value === "mp3"
          ? "mp3"
          : "mp4";

        const quality =
          ["high", "medium", "low"].includes(
            qualitySelect.value
          )
            ? qualitySelect.value
            : "high";

        const filename =
          safeName(
            filenameInput.value.trim() ||
            currentInfo.title ||
            "LinkGrab"
          );

        hideMessage();

        setLoading(
          true,
          format === "mp3"
            ? "正在製作 MP3…"
            : "正在製作 MP4，請稍候…"
        );

        try {
          const response = await fetchWithTimeout(
            "/api/download",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                url,
                format,
                quality,
                filename
              })
            }
          );

          if (!response.ok) {
            let data = null;

            try {
              data = await response.json();
            } catch {}

            throw new Error(
              data?.error ||
              `下載失敗（HTTP ${response.status}）`
            );
          }

          const blob = await response.blob();

          if (!blob || blob.size === 0) {
            throw new Error("伺服器沒有回傳檔案。");
          }

          const objectUrl = URL.createObjectURL(blob);

          const link = document.createElement("a");
          link.href = objectUrl;
          link.download = `${filename}.${format}`;
          document.body.appendChild(link);

          link.click();
          link.remove();

          setTimeout(() => {
            URL.revokeObjectURL(objectUrl);
          }, 30000);

          showMessage(
            "下載已開始。",
            "success"
          );
        } catch (error) {
          if (error.name === "AbortError") {
            showMessage(
              "下載等待時間過長，請稍後再試。"
            );
          } else {
            showMessage(
              error.message || "下載失敗，請稍後再試。"
            );
          }
        } finally {
          setLoading(false);
        }
      }

      function clearAll() {
        if (busy) return;

        urlInput.value = "";
        filenameInput.value = "";

        hideMessage();
        hideResult();

        thumbnail.removeAttribute("src");

        urlInput.focus();
      }

      formatSelect.addEventListener("change", () => {
        const isMp3 = formatSelect.value === "mp3";

        qualityOption.style.display =
          isMp3 ? "none" : "";
      });

      analyzeBtn.addEventListener("click", analyze);

      downloadBtn.addEventListener("click", download);

      clearBtn.addEventListener("click", clearAll);

      urlInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          analyze();
        }
      });

      window.addEventListener("pageshow", () => {
        busy = false;
        setLoading(false);
      });

      formatSelect.dispatchEvent(
        new Event("change")
      );
    })();
  </script>
</body>
</html>
